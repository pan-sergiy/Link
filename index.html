.veil{position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 0,rgba(255,110,20,.28),transparent 60%),linear-gradient(180deg,rgba(26,10,5,.15),var(--bg) 78%);z-index:-2}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
@keyframes drift{to{transform:scale(1.12) translateX(-2%)}}
main{max-width:460px;margin:0 auto;padding:56px 22px 48px;text-align:center}
.ava{position:relative;width:168px;height:168px;margin:0 auto 22px;border-radius:50%;padding:5px;background:conic-gradient(#ffa229,#ff5a1f,#d7263d,#ffd23f,#ffa229);animation:spin 6s linear infinite;box-shadow:0 0 38px rgba(255,90,31,.6),0 0 90px rgba(255,162,41,.4);opacity:0;animation:spin 6s linear infinite,pop .9s .1s cubic-bezier(.2,1.4,.4,1) forwards}
.ava img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 30%;border:4px solid var(--bg);animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
h1{font-family:Unbounded,Impact,sans-serif;font-weight:800;font-size:clamp(34px,10vw,46px);margin:0 0 10px;letter-spacing:-.01em;color:#fff;text-shadow:0 0 6px #fff,0 0 18px #ffa229,0 0 42px #ff5a1f;animation:flick 5s infinite}
@keyframes flick{0%,92%,96%,100%{opacity:1}93%{opacity:.55}95%{opacity:.85}}
.sub{margin:0 auto 30px;max-width:30ch;font-size:16px;line-height:1.5;font-weight:500;color:#ffd9a8}
.soc{display:flex;justify-content:center;gap:16px;margin-bottom:34px}
.soc a{--c:var(--amber);width:58px;height:58px;display:grid;place-items:center;border-radius:18px;color:var(--c);background:rgba(255,255,255,.04);border:1.5px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 25%,transparent);transition:transform .25s,box-shadow .25s,background .25s}
.soc a:hover,.soc a:focus-visible{transform:translateY(-5px) rotate(-4deg) scale(1.08);background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 30px var(--c),0 0 60px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 45%,transparent);outline:none}
.soc svg{width:28px;height:28px;fill:currentColor}
.line{height:2px;margin:0 8px 34px;background:linear-gradient(90deg,transparent,#d7263d,#ffa229,#ffd23f,transparent);box-shadow:0 0 12px #ff5a1f;background-size:200%;animation:flow 4s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.don{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:12px 20px 12px 12px;border-radius:22px;text-decoration:none;color:#fff;font:700 18px Manrope,sans-serif;text-align:left;overflow:hidden;background:linear-gradient(120deg,#ff9d00,#ff5a1f 55%,#d7263d);box-shadow:0 0 0 1.5px rgba(255,255,255,.35),0 0 28px rgba(255,110,20,.75),0 0 70px rgba(215,38,61,.45);animation:beat 2.2s ease-in-out infinite;transition:transform .2s}
.don::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s infinite}
.don:hover,.don:focus-visible{transform:scale(1.04);outline:none;animation-play-state:paused}
.don:active{transform:scale(.97)}
.don i{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:italic 800 34px Unbounded,sans-serif;background:#fff;color:#ff5a1f;box-shadow:0 0 18px rgba(255,255,255,.7)}
.don small{display:block;font-size:12px;font-weight:500;opacity:.85;margin-top:2px}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes shine{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
.fx{position:fixed;pointer-events:none;font-size:26px;z-index:9;animation:fly 1.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);opacity:0}}
.cat{position:fixed;right:10px;bottom:calc(0px + env(safe-area-inset-bottom,0px));width:150px;z-index:10;text-decoration:none;transform:translateY(112%);transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.cat.show{transform:translateY(0)}
.cat img{display:block;width:100%;filter:drop-shadow(0 0 12px rgba(255,150,40,.9));animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:rotate(-3deg) scaleY(1.02)}}
.say{position:absolute;right:86%;bottom:26%;width:max-content;max-width:190px;padding:10px 14px;border-radius:18px 18px 4px 18px;background:#fff4e6;color:#3a1608;font:800 14px Manrope,sans-serif;box-shadow:0 0 22px rgba(255,160,40,.8);transform:scale(0);transform-origin:100% 100%;transition:transform .45s .45s cubic-bezier(.3,1.7,.5,1)}
.cat.show .say{transform:scale(1)}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.paw{transform-box:fill-box;transform-origin:50% 100%;animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:tw 5s infinite}
@keyframes tw{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-9deg)}}
.soc{position:relative;margin-bottom:76px}
.soc a.hint{animation:nudge .6s ease-in-out 3;border-width:2.5px}
@keyframes nudge{50%{transform:translateY(-8px) scale(1.12)}}
.tip{position:absolute;top:74px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:#fff4e6;color:#3a1608;font:800 13px Manrope,sans-serif;white-space:nowrap;box-shadow:0 0 20px var(--c);scale:0;transform-origin:var(--ax) 0;transition:scale .35s cubic-bezier(.3,1.7,.5,1);pointer-events:none;z-index:5}
.tip.on{scale:1}
.tip::before{content:"";position:absolute;top:-7px;left:var(--ax);translate:-50% 0;border:8px solid transparent;border-bottom-color:#fff4e6;border-top:0}
.tip svg{width:18px;height:18px;fill:currentColor;flex:none}
.say svg,.don small svg{width:14px;height:14px;fill:#ff5a1f;vertical-align:-2px;margin-left:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ava{opacity:1}canvas,.cat{display:none}}
</style>
</head>

const c=document.getElementById('c'),x=c.getContext('2d');let W,H,L=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const cols=['#ffa229','#ff6a1a','#d7263d','#ffd23f'];
for(let i=0;i<34;i++)L.push({x:Math.random()*W,y:Math.random()*H,s:6+Math.random()*12,v:.4+Math.random()*1,w:Math.random()*6,r:Math.random()*6,c:cols[i%4]});
(function f(){x.clearRect(0,0,W,H);for(const l of L){l.y+=l.v;l.w+=.02;l.x+=Math.sin(l.w)*.8;l.r+=.02;if(l.y>H+20){l.y=-20;l.x=Math.random()*W}
x.save();x.translate(l.x,l.y);x.rotate(l.r);x.scale(1,Math.abs(Math.cos(l.w)));x.fillStyle=l.c;x.shadowColor=l.c;x.shadowBlur=14;x.beginPath();x.moveTo(0,-l.s);x.quadraticCurveTo(l.s,0,0,l.s);x.quadraticCurveTo(-l.s,0,0,-l.s);x.fill();x.restore()}
requestAnimationFrame(f)})();
const cat=document.getElementById('cat'),say=document.getElementById('say'),S=['Підтримай донатом вусатого!','Підтримай донатом вусатого!','Кинь донат вусатому!'];let si=0;

setTimeout(showCat,2500);setInterval(showCat,14000);
const SA=[...document.querySelectorAll('.soc a')],soc=document.querySelector('.soc'),tip=document.createElement('div');tip.className='tip';soc.appendChild(tip);let hi=0;
function nextHint(){SA.forEach(a=>a.classList.remove('hint'));const a=SA[hi++%SA.length];tip.classList.remove('on');
tip.innerHTML=a.querySelector('svg').outerHTML+'<span>Підпишись на мій '+a.dataset.n+'</span>';tip.style.setProperty('--c',getComputedStyle(a).getPropertyValue('--c'));
const w=tip.offsetWidth,cx=a.offsetLeft+a.offsetWidth/2,l=Math.max(0,Math.min(cx-w/2,soc.clientWidth-w));tip.style.left=l+'px';tip.style.setProperty('--ax',(cx-l)+'px');
a.classList.add('hint');tip.classList.add('on');setTimeout(()=>{a.classList.remove('hint');tip.classList.remove('on')},3200)}
setTimeout(()=>{nextHint();setInterval(nextHint,4000)},1800);
const d=document.getElementById('don');
function burst(e){const r=d.getBoundingClientRect(),e2=['🧡','🍁','✨','💜','🔥'];
for(let i=0;i<16;i++){const s=document.createElement('span');s.className='fx';s.textContent=e2[i%5];
s.style.left=(e.clientX||r.left+r.width/2)+'px';s.style.top=(e.clientY||r.top+20)+'px';
s.style.setProperty('--x',(Math.random()*240-120)+'px');s.style.setProperty('--y',(-60-Math.random()*180)+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');
document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
d.addEventListener('pointerenter',burst);d.addEventListener('click',burst);
